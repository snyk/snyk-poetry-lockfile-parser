version: 2.1

orbs:
  prodsec: snyk/prodsec-orb@1

executors:
  docker-node:
    parameters:
      version:
        default: "22"
        type: string
    docker:
      - image: cimg/node:<<parameters.version>>

commands:
  install:
    steps:
      - run:
          name: Install
          command: npm install
  test:
    steps:
      - run:
          name: Test
          command: npm test
  test-coverage:
    steps:
      - run:
          name: Test
          command: npm run test:coverage
  release:
    steps:
      - run:
          name: Release
          command: |
            export NPM_ID_TOKEN=$(circleci run oidc get --claims '{"aud": "npm:registry.npmjs.org"}')
            npx semantic-release@25.0.3
  lint:
    steps:
      - run:
          name: Lint
          command: npm run lint

jobs:
  security-scans:
    resource_class: small
    docker:
      - image: cimg/node:22
    steps:
      - checkout
      - install
      - prodsec/security_scans:
          mode: auto
          release-branch: master
          open-source-additional-arguments: --exclude=test
          iac-scan: disabled

  test:
    resource_class: medium
    parameters:
      version:
        default: "22"
        type: string
    executor:
      name: docker-node
      version: <<parameters.version>>
    steps:
      - checkout
      - install
      - test-coverage

  release:
    resource_class: small
    executor:
      name: docker-node
    steps:
      - checkout
      - install
      - release

  lint:
    resource_class: small
    executor:
      name: docker-node
      version: "22"
    steps:
      - checkout
      - install
      - lint

workflows:

  test:
    jobs:
      - prodsec/secrets-scan:
          name: Scan repository for secrets
          context:
            - snyk-bot-slack
            - prodsec-orb-runtime
          channel: snyk-vuln-alerts-sca-scanners
          filters:
            branches:
              ignore:
                - master

      - security-scans:
          name: Security Scans
          context:
            - engines_sca-scanners
            - prodsec-orb-runtime
          filters:
            branches:
              ignore:
                - master

      - lint:
          filters:
            branches:
              ignore:
                - master
      - test:
          requires:
            - lint
          matrix:
            parameters:
              version:
                - "22"
                - "24"
                - "26"
          filters:
            branches:
              ignore:
                - master
  release:
    jobs:
      - security-scans:
          name: Security Scans
          context:
            - engines_sca-scanners
            - prodsec-orb-runtime
          filters:
            branches:
              only:
                - master

      - release:
          context:
            - nodejs-install
            - github-release
          filters:
            branches:
              only:
                - master
